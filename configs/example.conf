# Example config. Copy to configs/<name>.conf and run: ./start_vnc.sh <name>
# This file is sourced by start_vnc.sh, so it is plain bash.

# Screen resolution as WIDTHxHEIGHT (default: 1920x1080)
RESOLUTION=1920x1080

# Set to 1 to run inside Docker on any machine (macOS always uses Docker)
FORCE_DOCKER=0
